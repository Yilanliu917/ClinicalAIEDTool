name: Feature request
description: Propose an educational or technical improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Learner or project need
      description: What problem should this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, privacy, and accessibility considerations
      description: Note likely risks, review needs, or limitations.

