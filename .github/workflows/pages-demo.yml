name: Publish Hiro prototype demo

on:
  push:
    branches:
      - yilan/pages-demo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hiro's prototype
        uses: actions/checkout@v4
        with:
          ref: hiro/import-project

      - name: Prepare student-facing site only
        run: |
          mkdir public
          cp prototype/case06_clinical_case_lab/mockup.html public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
